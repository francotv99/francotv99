<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>

    <!-- Plantilla de robot agente. Usa currentColor para cambiar de color según el tipo. -->
    <g id="bot" fill="none" stroke="currentColor" stroke-width="2">
      <!-- antena con luz pulsante -->
      <line x1="0" y1="-30" x2="0" y2="-40"/>
      <circle cx="0" cy="-43" r="4" fill="currentColor" stroke="none">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <!-- cabeza -->
      <rect x="-20" y="-30" width="40" height="30" rx="9" fill="#21262d"/>
      <!-- ojos que parpadean -->
      <ellipse cx="-7" cy="-16" rx="3.2" ry="3.5" fill="currentColor" stroke="none">
        <animate attributeName="ry" values="3.5;3.5;0.4;3.5;3.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="7" cy="-16" rx="3.2" ry="3.5" fill="currentColor" stroke="none">
        <animate attributeName="ry" values="3.5;3.5;0.4;3.5;3.5" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- boca -->
      <rect x="-7" y="-8" width="14" height="3" rx="1.5" fill="currentColor" stroke="none" opacity="0.7"/>
      <!-- cuerpo -->
      <rect x="-14" y="2" width="28" height="18" rx="5" fill="#21262d"/>
      <!-- luz de pecho -->
      <circle cx="0" cy="11" r="3" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <text x="450" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#58a6ff">Equipo de agentes trabajando</text>

  <!-- Rutas de comunicación (líneas tenues) -->
  <g fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <line x1="150" y1="200" x2="360" y2="150"/>
    <line x1="360" y1="150" x2="560" y2="210"/>
    <line x1="560" y1="210" x2="770" y2="160"/>
  </g>

  <!-- Paquetes de datos viajando entre agentes -->
  <rect width="10" height="7" rx="2" fill="#58a6ff">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M150,200 L360,150"/>
  </rect>
  <rect width="10" height="7" rx="2" fill="#3fb950">
    <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M360,150 L560,210"/>
  </rect>
  <rect width="10" height="7" rx="2" fill="#d29922">
    <animateMotion dur="2.5s" begin="-0.5s" repeatCount="indefinite" path="M560,210 L770,160"/>
  </rect>

  <!-- Agente 1: Planner (azul), camina de lado a lado -->
  <g transform="translate(150,200)">
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" path="M-50,0 L50,0 L-50,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.8s" repeatCount="indefinite"/>
        <use href="#bot" color="#58a6ff"/>
        <text x="0" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Planner</text>
      </g>
    </g>
  </g>

  <!-- Agente 2: Coder (verde), recorre una elipse -->
  <g transform="translate(360,150)">
    <g>
      <animateMotion dur="10s" repeatCount="indefinite" path="M-40,0 a40,18 0 1,0 80,0 a40,18 0 1,0 -80,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.9s" repeatCount="indefinite"/>
        <use href="#bot" color="#3fb950"/>
        <text x="0" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Coder</text>
      </g>
    </g>
  </g>

  <!-- Agente 3: Tester (amarillo), camina de lado a lado más rápido -->
  <g transform="translate(560,210)">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite" path="M-60,0 L60,0 L-60,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.7s" repeatCount="indefinite"/>
        <use href="#bot" color="#d29922"/>
        <text x="0" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Tester</text>
      </g>
    </g>
  </g>

  <!-- Agente 4: Deploy (rosa), recorre una elipse en sentido contrario -->
  <g transform="translate(770,160)">
    <g>
      <animateMotion dur="12s" repeatCount="indefinite" path="M-30,0 a30,14 0 1,1 60,0 a30,14 0 1,1 -60,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="1s" repeatCount="indefinite"/>
        <use href="#bot" color="#f778ba"/>
        <text x="0" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c9d1d9">Deploy</text>
      </g>
    </g>
  </g>
</svg>
