<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
    <pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2d5a27"/>
      <rect x="2" y="3" width="2" height="2" fill="#3e7a35"/>
      <rect x="8" y="8" width="2" height="2" fill="#24481f"/>
    </pattern>

    <!-- Estructura común de un héroe pixel (pies en 0,0). El color del cuerpo es currentColor. -->
    <g id="mage">
      <rect x="-5" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="1" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="-7" y="-21" width="14" height="14" fill="currentColor"/>
      <rect x="-10" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="7" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="-5" y="-31" width="10" height="10" fill="#f2c9a0"/>
      <rect x="-3" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="1" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <polygon points="-9,-31 0,-55 9,-31" fill="currentColor"/>
      <rect x="-10" y="-32" width="20" height="3" fill="currentColor"/>
      <rect x="11" y="-42" width="2" height="40" fill="#8b5a2b"/>
      <circle cx="12" cy="-44" r="3.5" fill="#79c0ff">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g id="warrior">
      <rect x="-5" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="1" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="-7" y="-21" width="14" height="14" fill="currentColor"/>
      <rect x="-10" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="7" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="-5" y="-31" width="10" height="10" fill="#f2c9a0"/>
      <rect x="-3" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="1" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="-6" y="-34" width="12" height="6" fill="#9aa4b2"/>
      <rect x="-1" y="-41" width="2" height="7" fill="currentColor"/>
      <rect x="12" y="-30" width="2" height="20" fill="#cfd8dc"/>
      <rect x="10" y="-12" width="6" height="2" fill="#8b5a2b"/>
    </g>

    <g id="archer">
      <rect x="-5" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="1" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="-7" y="-21" width="14" height="14" fill="currentColor"/>
      <rect x="-10" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="7" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="-5" y="-31" width="10" height="10" fill="#f2c9a0"/>
      <rect x="-3" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="1" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <polygon points="-7,-31 0,-40 7,-31" fill="currentColor"/>
      <rect x="-6" y="-33" width="12" height="4" fill="currentColor"/>
      <path d="M-15,-36 Q-22,-20 -15,-4" fill="none" stroke="#8b5a2b" stroke-width="2"/>
      <line x1="-15" y1="-36" x2="-15" y2="-4" stroke="#e6e6e6" stroke-width="1"/>
    </g>

    <g id="paladin">
      <rect x="-5" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="1" y="-8" width="4" height="8" fill="#2b2b3a"/>
      <rect x="-7" y="-21" width="14" height="14" fill="currentColor"/>
      <rect x="-10" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="7" y="-20" width="3" height="10" fill="currentColor"/>
      <rect x="-5" y="-31" width="10" height="10" fill="#f2c9a0"/>
      <rect x="-3" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="1" y="-26" width="2" height="2" fill="#1a1a1a"/>
      <rect x="-6" y="-35" width="12" height="7" fill="#cfd8dc"/>
      <rect x="-1" y="-41" width="2" height="6" fill="currentColor"/>
      <polygon points="-7,-20 -14,-3 -8,-2 -5,-14" fill="currentColor" opacity="0.8"/>
      <rect x="-17" y="-19" width="7" height="10" rx="2" fill="currentColor" stroke="#cfd8dc" stroke-width="1"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="900" height="300" rx="16" fill="url(#sky)"/>

  <!-- Estrellas parpadeando -->
  <g fill="#e6edf3">
    <rect x="60" y="30" width="2" height="2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="200" y="60" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="330" y="25" width="2" height="2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="520" y="55" width="2" height="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="700" y="28" width="2" height="2"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="850" y="70" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Luna -->
  <circle cx="800" cy="50" r="16" fill="#f4e4a6"/>
  <circle cx="806" cy="46" r="14" fill="#1b2a44"/>

  <!-- Nubes deslizándose -->
  <g fill="#2a3a55" opacity="0.7">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-120,0;1000,0" dur="70s" repeatCount="indefinite"/>
      <ellipse cx="60" cy="90" rx="34" ry="10"/>
      <ellipse cx="78" cy="84" rx="22" ry="9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1000,0;-120,0" dur="90s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="110" rx="40" ry="11"/>
      <ellipse cx="322" cy="104" rx="24" ry="10"/>
    </g>
  </g>

  <!-- Suelo con pasto -->
  <rect x="0" y="240" width="900" height="60" fill="url(#grass)"/>

  <!-- Camino de tierra -->
  <rect x="0" y="236" width="900" height="16" fill="#7a5230"/>
  <rect x="0" y="236" width="900" height="2" fill="#94653a"/>

  <!-- Casa izquierda -->
  <g>
    <rect x="40" y="168" width="80" height="72" fill="#6b4f3a"/>
    <polygon points="32,170 80,128 128,170" fill="#8b2e2e"/>
    <rect x="66" y="206" width="18" height="34" fill="#3b2a1e"/>
    <rect x="48" y="186" width="12" height="12" fill="#ffd166">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="94" y="186" width="12" height="12" fill="#ffd166">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Casa derecha -->
  <g>
    <rect x="780" y="168" width="80" height="72" fill="#5b4a3a"/>
    <polygon points="772,170 820,128 868,170" fill="#2e5b8b"/>
    <rect x="806" y="206" width="18" height="34" fill="#3b2a1e"/>
    <rect x="788" y="186" width="12" height="12" fill="#ffd166">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="834" y="186" width="12" height="12" fill="#ffd166">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Árboles -->
  <g>
    <rect x="266" y="190" width="8" height="50" fill="#5b3a1e"/>
    <circle cx="270" cy="176" r="22" fill="#2e7d32"/>
    <circle cx="256" cy="186" r="14" fill="#388e3c"/>
    <circle cx="284" cy="186" r="14" fill="#2b6e2e"/>
  </g>
  <g>
    <rect x="636" y="190" width="8" height="50" fill="#5b3a1e"/>
    <circle cx="640" cy="176" r="22" fill="#2e7d32"/>
    <circle cx="626" cy="186" r="14" fill="#388e3c"/>
    <circle cx="654" cy="186" r="14" fill="#2b6e2e"/>
  </g>

  <!-- Antorchas que parpadean -->
  <ellipse cx="128" cy="200" rx="3" ry="5" fill="#ff9f1c">
    <animate attributeName="ry" values="5;3;6;4;5" dur="0.9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="812" cy="200" rx="3" ry="5" fill="#ff9f1c">
    <animate attributeName="ry" values="4;6;3;5;4" dur="1.1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Título -->
  <text x="450" y="38" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#58a6ff">Gremio de Agentes</text>

  <!-- Rutas de comunicación (arcos tenues) -->
  <g fill="none" stroke="#3b4a63" stroke-width="1.5" stroke-dasharray="4 5">
    <path id="r1" d="M170,190 Q270,120 370,190"/>
    <path id="r2" d="M370,190 Q465,120 560,190"/>
    <path id="r3" d="M560,190 Q665,120 760,190"/>
  </g>

  <!-- Mensajes (orbes dorados) viajando entre héroes -->
  <circle r="4" fill="#ffd166">
    <animateMotion dur="3s" repeatCount="indefinite" path="M170,190 Q270,120 370,190"/>
  </circle>
  <circle r="4" fill="#ffd166">
    <animateMotion dur="3.4s" begin="-1s" repeatCount="indefinite" path="M370,190 Q465,120 560,190"/>
  </circle>
  <circle r="4" fill="#ffd166">
    <animateMotion dur="3s" begin="-0.5s" repeatCount="indefinite" path="M560,190 Q665,120 760,190"/>
  </circle>

  <!-- Planner: Mago (azul), camina de lado a lado -->
  <g transform="translate(170,240)">
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" path="M-60,0 L60,0 L-60,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.6s" repeatCount="indefinite"/>
        <use href="#mage" color="#58a6ff"/>
        <text x="0" y="-62" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#c9d1d9">Planner · Mago</text>
      </g>
    </g>
  </g>

  <!-- Coder: Guerrero (verde), camina con un "!" de misión -->
  <g transform="translate(370,240)">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite" path="M-40,0 L40,0 L-40,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.5s" repeatCount="indefinite"/>
        <use href="#warrior" color="#3fb950"/>
        <text x="0" y="-74" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#ffd166">!
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="-62" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#c9d1d9">Coder · Guerrero</text>
      </g>
    </g>
  </g>

  <!-- Tester: Arquero (amarillo), patrulla rápido -->
  <g transform="translate(560,240)">
    <g>
      <animateMotion dur="5s" repeatCount="indefinite" path="M-70,0 L70,0 L-70,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.4s" repeatCount="indefinite"/>
        <use href="#archer" color="#d29922"/>
        <text x="0" y="-52" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#c9d1d9">Tester · Arquero</text>
      </g>
    </g>
  </g>

  <!-- Deploy: Paladín (rosa), patrulla cerca del pueblo -->
  <g transform="translate(760,240)">
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" path="M-40,0 L40,0 L-40,0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.7s" repeatCount="indefinite"/>
        <use href="#paladin" color="#f778ba"/>
        <text x="0" y="-62" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#c9d1d9">Deploy · Paladín</text>
      </g>
    </g>
  </g>
</svg>
